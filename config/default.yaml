# tWhEEL standard GO-workflow configuration template

input:
  transcriptome: ""  # Required transcript FASTA; .gz is supported
  protein_sequences: ""  # Optional existing protein FASTA; .gz is supported
  protein_transcript_mapping: ""  # Headerless TSV: transcript_id<TAB>protein_id
  genome_assembly: ""  # Optional off-target FASTA; transcriptome is the fallback
  protein_db_for_goanalysis: ""  # Protein FASTA whose best-hit IDs resolve in UniProt

output:
  base_dir: "outputs"  # Root below which a timestamped run directory is created
  intermediate: "outputs/intermediate"  # Replaced with <run>/intermediate at startup

transdecoder:
  docker_image: "quay.io/biocontainers/transdecoder:5.7.1--pl5321hdfd78af_0"
  min_protein_len: 100
  skip_if_protein_provided: true

busco:
  docker_image: "ezlabgva/busco:v5.2.2_cv1"
  lineage: "metazoa_odb10"
  cpu: 8

fasta_search:
  docker_image: "quay.io/biocontainers/fasta3:36.3.8--h470a237_4"
  evalue: 0.1
  threads: 8

crispr:
  docker_image: "kazukinakamae/crisflash:1.2.0"
  pam_pattern: "NGG"
  max_mismatch: 2
  threads: 10
  memory: "40g"

go_analysis:
  add_go_image: "kazukinakamae/add-go-columns:v1.1"
  compute_kfi_image: "kazukinakamae/compute_go_kfi:v1.1"
  count_parent_image: "kazukinakamae/count_go_parent_terms:v1.1"

report:
  generate_html: true
  generate_summary: true
  web_port: 5000  # Legacy setting; the current pipeline generates static files only

database:
  force_rebuild: false  # Rebuild the minimal GO metadata cache when true

docker:
  max_memory: "40g"  # Legacy setting; individual modules set Docker limits directly
  use_docker: true  # Legacy setting; Docker cannot currently be disabled

execution:
  steps:
    - "gene_prediction"
    - "annotation"
    - "guide_design"
    - "go_analysis"
    - "report_generation"
  parallel: false  # Legacy setting; steps currently run sequentially
  verbose: true
