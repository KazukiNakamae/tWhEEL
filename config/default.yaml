# tWhEEL - トランスクリプトーム機能解析パイプライン設定ファイル

# 入力ファイル設定
input:
  genome_assembly: ""  # ゲノムアセンブリファイル (.fna or .fa) - オプション (未指定の場合はtranscriptomeを使用)
  transcriptome: ""    # トランスクリプトームファイル (.fsa_nt or .fa) - 必須
  uniprot_db: ""       # UniProtデータベースファイル (.fasta) - 必須

# 出力ディレクトリ設定
output:
  base_dir: "outputs"
  intermediate: "outputs/intermediate"
  
# TransDecoder設定
transdecoder:
  docker_image: "quay.io/biocontainers/transdecoder:5.7.1--pl5321hdfd78af_0"
  min_protein_len: 85

# BUSCO評価設定
busco:
  docker_image: "ezlabgva/busco:v5.2.2_cv1"
  lineage: "metazoa_odb10"
  cpu: 8

# FASTA検索設定
fasta_search:
  docker_image: "quay.io/biocontainers/fasta3:36.3.8--h470a237_4"
  evalue: 0.1
  threads: 8

# CRISPRガイド設計設定
crispr:
  docker_image: "kazukinakamae/crisflash:1.2.0"
  pam_pattern: "NGG"
  max_mismatch: 2
  threads: 10
  memory: "40g"
  # 注意: genome_assemblyが指定されていない場合、オフターゲット検索にtranscriptomeを使用します
  # この場合、ゲノム全体をカバーしないため、オフターゲット検索の精度が低下する可能性があります

# GO解析設定
go_analysis:
  add_go_image: "kazukinakamae/add-go-columns:v1.0"
  compute_kfi_image: "kazukinakamae/compute_go_kfi:v1.0"
  count_parent_image: "kazukinakamae/count_go_parent_terms:v1.0"

# レポート設定
report:
  generate_html: true
  generate_summary: true
  web_port: 5000

# データベース設定
database:
  force_rebuild: false  # 既存データベースを強制的に再作成する場合はtrueに設定

# Docker設定
docker:
  max_memory: "40g"
  use_docker: true

# 実行設定
execution:
  steps:
    - "gene_prediction"
    - "annotation"
    - "guide_design"
    - "go_analysis"
    - "report_generation"
  parallel: false
  verbose: true
