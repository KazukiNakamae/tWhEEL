# Historical local SGD/WikiPathways run configuration.
# LOCAL_DATA is excluded from Git, so replace every input path in a fresh clone.

input:
  transcriptome: "./LOCAL_DATA/20250917_Saccharomyces_cerevisiae_CEN_PK113_7D_Pathway_KFI/Saccharomyces_cerevisiae_cen_pk113_7d_gca_000269885.ASM26988v1.cdna.all_simpleheader.fa"
  protein_sequences: "./LOCAL_DATA/20250917_Saccharomyces_cerevisiae_CEN_PK113_7D_Pathway_KFI/Saccharomyces_cerevisiae_cen_pk113_7d_gca_000269885.ASM26988v1.pep.all.fa"
  protein_transcript_mapping: "./LOCAL_DATA/20250917_Saccharomyces_cerevisiae_CEN_PK113_7D_Pathway_KFI/Saccharomyces_cerevisiae_cen_pk113_7d_gca_000269885.ASM26988v1.62.gff3.tx2protein.tsv"  # Headerless: transcript_id<TAB>protein_id
  sgd_db: "./LOCAL_DATA/db/sgd_S288C_reference_orf_trans_headermodified.fasta"
  genome_assembly: "./LOCAL_DATA/20250917_Saccharomyces_cerevisiae_CEN_PK113_7D_Pathway_KFI/Saccharomyces_cerevisiae_cen_pk113_7d_gca_000269885.ASM26988v1.dna_rm.toplevel.fa"

output:
  base_dir: "outputs"
  intermediate: "outputs/intermediate"  # Replaced with <run>/intermediate at startup

transdecoder:
  docker_image: "quay.io/biocontainers/transdecoder:5.7.1--pl5321hdfd78af_0"
  min_protein_len: 100
  skip_if_protein_provided: true

busco:
  docker_image: "ezlabgva/busco:v5.2.2_cv1"
  lineage: "saccharomycetes_odb10"
  cpu: 8

fasta_search:
  docker_image: "quay.io/biocontainers/fasta3:36.3.8--h470a237_4"
  evalue: 0.1
  threads: 8

crispr:
  docker_image: "kazukinakamae/crisflash:1.2.0"
  pam_pattern: "NGG"
  max_mismatch: 2
  threads: 10
  memory: "40g"

pathway_analysis:
  wikipathways_gpml_dir: "./LOCAL_DATA/db/wikipathways-20250910-gpml-Saccharomyces_cerevisiae"
  target_gene_databases:
    - database_name: "SGD"
      id_pattern: '^S\d{9}$'
      annotation_key: "sgd_id"
    - database_name: "Ensembl"
      id_pattern: '^Y[A-Z]{2}\d{3}[CW]$'
      annotation_key: "ensembl_id"
  minimum_pathway_coverage: 0.5
  skip_low_coverage_pathways: true

pathway_report:
  generate_html: true  # Legacy setting; the report step always generates HTML
  output_name: "pathway_report.html"
  web_port: 5001  # Legacy setting; no web server is started

docker:
  max_memory: "40g"  # Legacy setting; individual modules set limits directly
  use_docker: true  # Legacy setting; Docker cannot currently be disabled

execution:
  steps:
    - "gene_prediction"
    - "sgd_annotation"
    - "guide_design"
    - "pathway_analysis"
    - "pathway_report_generation"
  parallel: false  # Legacy setting; steps currently run sequentially
  verbose: true

# Local run example:
# python src/twheel.py --config config/input_for_PathwayAnalysis_20250917.yaml --name yeast_pathway_analysis
