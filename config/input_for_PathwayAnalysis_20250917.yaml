# tWhEEL - 既存アミノ酸配列ファイルを使用する設定例
# このファイルは既にORF予測が完了したアミノ酸配列を直接使用する場合の設定例です

# 入力ファイル設定
input:
  # トランスクリプトームファイル
  transcriptome: "./LOCAL_DATA/20250917_Saccharomyces_cerevisiae_CEN_PK113_7D_Pathway_KFI/Saccharomyces_cerevisiae_cen_pk113_7d_gca_000269885.ASM26988v1.cdna.all_simpleheader.fa"  # .fsa_nt, .fa形式対応
  
  # 既存のアミノ酸配列ファイル
  protein_sequences: "./LOCAL_DATA/20250917_Saccharomyces_cerevisiae_CEN_PK113_7D_Pathway_KFI/Saccharomyces_cerevisiae_cen_pk113_7d_gca_000269885.ASM26988v1.pep.all.fa"  # .fasta, .fa, .pep形式対応
  
  # タンパク質ID→トランスクリプトIDマッピングファイル
  protein_transcript_mapping: "./LOCAL_DATA/20250917_Saccharomyces_cerevisiae_CEN_PK113_7D_Pathway_KFI/Saccharomyces_cerevisiae_cen_pk113_7d_gca_000269885.ASM26988v1.62.gff3.tx2protein.tsv"  # タブ区切り形式: protein_id<TAB>transcript_id
  
  # SGDデータベース
  sgd_db: "./LOCAL_DATA/db/sgd_S288C_reference_orf_trans_headermodified.fasta"
  
  # ゲノムアセンブリ
  genome_assembly: "./LOCAL_DATA/20250917_Saccharomyces_cerevisiae_CEN_PK113_7D_Pathway_KFI/Saccharomyces_cerevisiae_cen_pk113_7d_gca_000269885.ASM26988v1.dna_rm.toplevel.fa"

# 出力ディレクトリ設定
output:
  base_dir: "outputs"
  intermediate: "outputs/intermediate"
  
# TransDecoder設定（既存タンパク質モードでは自動的にスキップされます）
transdecoder:
  docker_image: "quay.io/biocontainers/transdecoder:5.7.1--pl5321hdfd78af_0"
  min_protein_len: 100
  skip_if_protein_provided: true  # 既存タンパク質配列が指定されている場合、TransDecoderをスキップ

# BUSCO評価設定（既存タンパク質配列の品質評価）
busco:
  docker_image: "ezlabgva/busco:v5.2.2_cv1"
  lineage: "saccharomycetes_odb10"  # 使用する生物のデータベースに応じて変更
  cpu: 8

# FASTA検索設定（UniProtに対する機能アノテーション）
fasta_search:
  docker_image: "quay.io/biocontainers/fasta3:36.3.8--h470a237_4"
  evalue: 0.1
  threads: 8

# CRISPRガイド設計設定
crispr:
  docker_image: "kazukinakamae/crisflash:1.2.0"
  pam_pattern: "NGG"
  max_mismatch: 2
  threads: 10
  memory: "40g"

# GO解析設定
go_analysis:
  add_go_image: "kazukinakamae/add-go-columns:v1.0"
  compute_kfi_image: "kazukinakamae/compute_go_kfi:v1.0"
  count_parent_image: "kazukinakamae/count_go_parent_terms:v1.0"

# パスウェイ解析設定
pathway_analysis:
  wikipathways_gpml_dir: "./LOCAL_DATA/db/wikipathways-20250910-gpml-Saccharomyces_cerevisiae"
  target_gene_databases:
    - database_name: "SGD"
      id_pattern: "^S\\d{9}$"       # S + 9桁数字
      annotation_key: "sgd_id"
    - database_name: "Ensembl"      # 将来の生物種対応用
      id_pattern: "^Y[A-Z]{2}\\d{3}[CW]$"
      annotation_key: "ensembl_id"
  minimum_pathway_coverage: 0.5     # 最小カバー率（50%未満は警告）
  skip_low_coverage_pathways: true  # 低カバー率パスウェイのスキップ

# パスウェイレポート設定
pathway_report:
  generate_html: true
  output_name: "pathway_report.html"
  web_port: 5001  # GO用レポートと分離

# レポート設定
report:
  generate_html: true
  generate_summary: true
  web_port: 5000

# データベース設定
database:
  force_rebuild: false

# Docker設定
docker:
  max_memory: "40g"
  use_docker: true

# 実行設定
execution:
  steps:
    - "gene_prediction"         # BUSCO評価のみ実行（TransDecoder スキップ）
    - "sgd_annotation"          # SGDアノテーション（パスウェイ解析用）
    - "guide_design"            # CRISPRガイド設計
    - "pathway_analysis"        # パスウェイ解析とPW-KFI計算
    - "pathway_report_generation"  # PW-KFI専用HTMLレポート生成
  parallel: false
  verbose: true

# 使用例:
# python src/twheel.py --config config/example_existing_protein.yaml --name existing_protein_analysis
