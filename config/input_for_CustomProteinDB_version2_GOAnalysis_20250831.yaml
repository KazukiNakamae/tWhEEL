# Historical local GO configuration using existing protein sequences.
# LOCAL_DATA is excluded from Git, so replace every input path in a fresh clone.

# Input files
input:
  # Transcriptome input
  transcriptome: "./LOCAL_DATA/20250831_Danio_rerio_GRCz12tu/GCF_049306965.1_GRCz12tu_rna.fa"
  
  # Existing protein sequences
  protein_sequences: "./LOCAL_DATA/20250831_Danio_rerio_GRCz12tu/GCF_049306965.1_GRCz12tu_protein.fa"

  # Protein-to-transcript mapping input
  protein_transcript_mapping: "LOCAL_DATA/20250831_Danio_rerio_GRCz12tu/GCF_049306965.1_GRCz12tu_genomic.gff.tx2protein_XMplus.tsv"  # Headerless TSV: transcript_id<TAB>protein_id

  # Protein database used for GO annotation
  protein_db_for_goanalysis: "./LOCAL_DATA/db/uniprot_sprot.fasta"
  
  # Genome used as the off-target reference
  genome_assembly: "./LOCAL_DATA/20250831_Danio_rerio_GRCz12tu/GCF_049306965.1_GRCz12tu_genomic.fa"

# Output settings
output:
  base_dir: "outputs"
  intermediate: "outputs/intermediate"  # Legacy: overwritten with the generated run directory
  
# TransDecoder settings
transdecoder:
  docker_image: "quay.io/biocontainers/transdecoder:5.7.1--pl5321hdfd78af_0"
  min_protein_len: 100
  skip_if_protein_provided: true  # Skip TransDecoder when protein_sequences exists

# BUSCO settings
busco:
  docker_image: "ezlabgva/busco:v5.2.2_cv1"
  lineage: "actinopterygii_odb10"  # Select a lineage suitable for the organism
  cpu: 8

# FASTA search settings
fasta_search:
  docker_image: "quay.io/biocontainers/fasta3:36.3.8--h470a237_4"
  evalue: 0.1
  threads: 8

# CRISPR guide settings
crispr:
  docker_image: "kazukinakamae/crisflash:1.2.0"
  pam_pattern: "NGG"
  max_mismatch: 2
  threads: 10
  memory: "40g"

# GO analysis settings
go_analysis:
  add_go_image: "kazukinakamae/add-go-columns:v1.1"
  compute_kfi_image: "kazukinakamae/compute_go_kfi:v1.1"
  count_parent_image: "kazukinakamae/count_go_parent_terms:v1.1"

# Report settings
report:
  generate_html: true
  generate_summary: true
  web_port: 5000  # Legacy: no server is started and this value is not read

# Database settings
database:
  force_rebuild: false

# Legacy Docker settings; these keys are not read by the current runtime
docker:
  max_memory: "40g"
  use_docker: true

# Execution settings
execution:
  steps:
    - "gene_prediction"
    - "annotation"
    - "guide_design"
    - "go_analysis"
    - "report_generation"
  parallel: false  # Legacy: steps always run sequentially
  verbose: true

# Local run example:
# python src/twheel.py --config config/input_for_CustomProteinDB_version2_GOAnalysis_20250831.yaml --name custom_protein_db_v2
