# tWhEEL - 既存アミノ酸配列ファイルを使用する設定例
# このファイルは既にORF予測が完了したアミノ酸配列を直接使用する場合の設定例です

# 入力ファイル設定
input:
  # トランスクリプトームファイル
  transcriptome: "./LOCAL_DATA/20250831_Danio_rerio_GRCz12tu/GCF_049306965.1_GRCz12tu_rna.fa"  # .fsa_nt, .fa形式対応
  
  # 既存のアミノ酸配列ファイル
  protein_sequences: "./LOCAL_DATA/20250831_Danio_rerio_GRCz12tu/GCF_049306965.1_GRCz12tu_protein.fa"  # .fasta, .fa, .pep形式対応

  # タンパク質ID→トランスクリプトIDマッピングファイル
  protein_transcript_mapping: "LOCAL_DATA/20250831_Danio_rerio_GRCz12tu/GCF_049306965.1_GRCz12tu_genomic.gff.tx2protein_XMplus.tsv"  # タブ区切り形式: protein_id<TAB>transcript_id

  # GO解析用タンパク質データベース
  protein_db_for_goanalysis: "./LOCAL_DATA/db/uniprot_sprot.fasta"
  
  # ゲノムアセンブリ
  genome_assembly: "./LOCAL_DATA/20250831_Danio_rerio_GRCz12tu/GCF_049306965.1_GRCz12tu_genomic.fa"

# 出力ディレクトリ設定
output:
  base_dir: "outputs"
  intermediate: "outputs/intermediate"
  
# TransDecoder設定（既存タンパク質モードでは自動的にスキップされます）
transdecoder:
  docker_image: "quay.io/biocontainers/transdecoder:5.7.1--pl5321hdfd78af_0"
  min_protein_len: 85
  skip_if_protein_provided: true  # 既存タンパク質配列が指定されている場合、TransDecoderをスキップ

# BUSCO評価設定（既存タンパク質配列の品質評価）
busco:
  docker_image: "ezlabgva/busco:v5.2.2_cv1"
  lineage: "actinopterygii_odb10"  # 使用する生物のデータベースに応じて変更
  cpu: 8

# FASTA検索設定（UniProtに対する機能アノテーション）
fasta_search:
  docker_image: "quay.io/biocontainers/fasta3:36.3.8--h470a237_4"
  evalue: 0.1
  threads: 8

# CRISPRガイド設計設定
crispr:
  docker_image: "kazukinakamae/crisflash:1.2.0"
  pam_pattern: "NGG"
  max_mismatch: 2
  threads: 10
  memory: "40g"

# GO解析設定
go_analysis:
  add_go_image: "kazukinakamae/add-go-columns:v1.0"
  compute_kfi_image: "kazukinakamae/compute_go_kfi:v1.0"
  count_parent_image: "kazukinakamae/count_go_parent_terms:v1.0"

# レポート設定
report:
  generate_html: true
  generate_summary: true
  web_port: 5000

# データベース設定
database:
  force_rebuild: false

# Docker設定
docker:
  max_memory: "40g"
  use_docker: true

# 実行設定
execution:
  steps:
    - "gene_prediction"    # BUSCO評価のみ実行（TransDecoder スキップ）
    - "annotation"         # 機能アノテーション
    - "guide_design"       # CRISPRガイド設計
    - "go_analysis"        # GO解析とKFI計算
    - "report_generation"  # HTMLレポート生成
  parallel: false
  verbose: true

# 使用例:
# python src/twheel.py --config config/example_existing_protein.yaml --name existing_protein_analysis
