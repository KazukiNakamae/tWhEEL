# tWhEEL standard GO workflow using supplied protein sequences

input:
  transcriptome: "/path/to/your/transcriptome.fasta"
  protein_sequences: "/path/to/your/existing_proteins.fasta"
  protein_transcript_mapping: "/path/to/your/protein_transcript_mapping.tsv"  # Headerless: transcript_id<TAB>protein_id
  protein_db_for_goanalysis: "/path/to/uniprot_sprot.fasta"
  genome_assembly: "/path/to/genome.fasta"  # Optional; transcriptome is the fallback

output:
  base_dir: "outputs"
  intermediate: "outputs/intermediate"  # Replaced with <run>/intermediate at startup

transdecoder:
  docker_image: "quay.io/biocontainers/transdecoder:5.7.1--pl5321hdfd78af_0"
  min_protein_len: 100
  skip_if_protein_provided: true

busco:
  docker_image: "ezlabgva/busco:v5.2.2_cv1"
  lineage: "metazoa_odb10"  # Select the lineage appropriate for the organism
  cpu: 8

fasta_search:
  docker_image: "quay.io/biocontainers/fasta3:36.3.8--h470a237_4"
  evalue: 0.1
  threads: 8

crispr:
  docker_image: "kazukinakamae/crisflash:1.2.0"
  pam_pattern: "NGG"
  max_mismatch: 2
  threads: 10
  memory: "40g"

go_analysis:
  add_go_image: "kazukinakamae/add-go-columns:v1.0"
  compute_kfi_image: "kazukinakamae/compute_go_kfi:v1.0"
  count_parent_image: "kazukinakamae/count_go_parent_terms:v1.0"

report:
  generate_html: true
  generate_summary: true
  web_port: 5000  # Legacy setting; the current pipeline generates static files only

database:
  force_rebuild: false

docker:
  max_memory: "40g"  # Legacy setting; individual modules set Docker limits directly
  use_docker: true  # Legacy setting; Docker cannot currently be disabled

execution:
  steps:
    - "gene_prediction"
    - "annotation"
    - "guide_design"
    - "go_analysis"
    - "report_generation"
  parallel: false  # Legacy setting; steps currently run sequentially
  verbose: true

# Example:
# python src/twheel.py --config config/example_existing_protein.yaml --name existing_protein_analysis
